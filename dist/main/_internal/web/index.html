<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=fullscreen" />
    <title>Chromos Clock</title>
    <link rel="shortcut icon" href="assets/clock.png" type="image/x-icon">

<body style="color: var(--main-color);">
    <p id="greeting">Good Morning</p>

    </div>
    <button id="fullscreen-btn">
        <span class="material-symbols-outlined">fullscreen</span>
    </button>
    
</body>

<script type="text/javascript" src="/eel.js"></script>
<script src="index.js"></script>

</html>
