<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Chromos Clock</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="shortcut icon" href="/assets/favicon.ico">
</head>
<body style="color: var(--main-color);">
    <div class="main-content">
        <p id="greeting"></p>
        <div class="time">
            <span id="hours">00</span><span>:</span><span id="minutes">00</span>
        </div>
        <div class="options">
            <button id="fullscreen-btn" class="options-btn">
                <span class="material-symbols-outlined">fullscreen</span>
            </button>
            <button id="settings-btn" class="options-btn">
                <span class="material-symbols-outlined">density_medium</span>
            </button>
        </div>
    </div>
    <div class="sidebar">
        <p>Options</p>
        <label for="greeting1">Greeting 1</label>
        <input type="text" id="greeting1" name="greeting1" placeholder="">
        <label for="greeting2">Greeting 2</label>
        <input type="text" id="greeting2" name="greeting2" placeholder="">
        <label for="greeting3">Greeting 3</label>
        <input type="text" id="greeting3" name="greeting3" placeholder="">
    </div>
    
</body>

<script type="text/javascript" src="/eel.js"></script>
<script src="index.js"></script>

</html>
